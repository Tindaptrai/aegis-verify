[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-verify"
version = "0.1.0"
description = "Evidence-driven detection validation contracts"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "PyYAML==6.0.3"]

[project.scripts]
aegis = "aegis_verify.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["aegis_verify", "aegis_verify.models", "aegis_verify.validation", "aegis_verify.intake", "aegis_verify.cli", "aegis_verify.compare", "aegis_verify.connectors", "aegis_verify.connectors.wazuh", "aegis_verify.connectors.suricata", "aegis_verify.connectors.pfsense", "aegis_verify.connectors.cowrie"]
package-dir = { aegis_verify = "backend/app", "aegis_verify.connectors" = "connectors" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
