[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-verify"
version = "0.3.0"
description = "Evidence-driven detection validation contracts"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "PyYAML==6.0.3"]

[project.scripts]
aegis = "aegis_verify.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["aegis_verify", "aegis_verify.models", "aegis_verify.validation", "aegis_verify.intake", "aegis_verify.cli", "aegis_verify.compare", "aegis_verify.demo", "aegis_verify.resources", "aegis_verify.dashboard", "aegis_verify.labcollect", "aegis_verify.connectors", "aegis_verify.connectors.wazuh", "aegis_verify.connectors.suricata", "aegis_verify.connectors.pfsense", "aegis_verify.connectors.cowrie", "aegis_verify.connectors.snort", "aegis_verify.connectors.opnsense", "aegis_verify.connectors.elastic"]
package-dir = { aegis_verify = "backend/app", "aegis_verify.connectors" = "connectors" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
