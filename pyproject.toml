[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-verify"
version = "0.1.0"
description = "Evidence-driven detection validation contracts"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["aegis_verify", "aegis_verify.models"]
package-dir = { aegis_verify = "backend/app" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
