name: Agent connection native gates and public packages

on:
  pull_request:
    paths:
      - 'agent/connection/**'
      - 'deploy/agent/**'
      - 'manager/**'
      - 'scripts/stage_agent_connection.py'
      - 'scripts/agent_connection_runtime_files.json'
      - 'scripts/tests/agent/**'
      - 'backend/tests/test_agent_connection_packaging.py'
      - 'docs/manager/**'
      - '.github/workflows/agent-connection.yml'
  push:
    branches: [main]
    paths:
      - 'agent/connection/**'
      - 'deploy/agent/**'
      - 'manager/**'
      - 'scripts/stage_agent_connection.py'
      - 'scripts/agent_connection_runtime_files.json'
      - 'scripts/tests/agent/**'
      - 'backend/tests/test_agent_connection_packaging.py'
      - 'docs/manager/**'
      - '.github/workflows/agent-connection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-connection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-connection:
    name: Presence TLS and native service (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Public packages identify the exact checked-out head, never a merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Require native systemd host and Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(cat /proc/1/comm)" = systemd
          test "$(uname -m)" = x86_64
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          parents=(/opt /var /var/lib /etc /etc/systemd /etc/systemd/system)
          for parent in "${parents[@]}"; do
            test -d "$parent"
            test ! -L "$parent"
            owner=$(stat -c %u -- "$parent")
            mode=$(stat -c %a -- "$parent")
            printf 'ci_parent_before uid=%s mode=%s path=%s\n' "$owner" "$mode" "$parent"
            test "$owner" = 0
          done
          # This exact hosted image build makes /opt world writable:
          # https://github.com/actions/runner-images/blob/7e7dc1bcc0ef464e5e315a2b4c33609590c6cffe/images/ubuntu/scripts/build/configure-system.sh#L15
          # Harden only the disposable runner's /opt itself; keep installer guards.
          sudo chmod go-w -- /opt
          for parent in "${parents[@]}"; do
            owner=$(stat -c %u -- "$parent")
            mode=$(stat -c %a -- "$parent")
            printf 'ci_parent_after uid=%s mode=%s path=%s\n' "$owner" "$mode" "$parent"
            test "$owner" = 0
            (( (8#$mode & 0022) == 0 ))
          done
          sudo apt-get update
          sudo apt-get install -y ca-certificates libc6 libgcc-s1 libgssapi-krb5-2 libicu74 libssl3t64 libstdc++6 tzdata zlib1g
      - name: Test core, builders and installer contracts
        run: |
          python -m pip install -e '.[test]' -r manager/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project agent/connection/Aegis.Connection.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $base = Join-Path $env:RUNNER_TEMP 'connection-builder-tests'
          if (Test-Path -LiteralPath $base) { throw 'fresh_basetemp_required' }
          python -m pytest backend/tests/test_agent_connection_packaging.py -q -p no:cacheprovider --basetemp $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts/tests/agent/Test-InstallerContracts.ps1
          } else {
            bash scripts/tests/agent/test-installer-contracts.sh
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish pinned self-contained client and deterministic public archive
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'connection-publish'
          $release = Join-Path $env:RUNNER_TEMP 'connection-release'
          $package = Join-Path $env:RUNNER_TEMP 'connection-package'
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish agent/connection/Aegis.Connection -c Release -r '${{ matrix.runtime }}' --self-contained true -p:DebugSymbols=false -p:DebugType=None -o $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage_agent_connection.py --source-root (Get-Location).Path --build-root $build --output-root $release --runtime '${{ matrix.runtime }}' --version 0.1.0 --commit $commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path $package | Out-Null
          if ($IsWindows) {
            Expand-Archive -LiteralPath (Join-Path $release 'AEGIS-Agent-Connection-0.1.0-win-x64.zip') -DestinationPath $package
            $executable = Join-Path $package 'bin/aegis-agent.exe'
          } else {
            tar -xzf (Join-Path $release 'AEGIS-Agent-Connection-0.1.0-linux-x64.tar.gz') -C $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $executable = Join-Path $package 'bin/aegis-agent'
          }
          "AEGIS_CONNECTION_TEST_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AEGIS_CONNECTION_SERVICE_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AEGIS_CONNECTION_RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AEGIS_CONNECTION_SOURCE_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Require actual published TLS enrollment and native service lifecycle
        run: |
          if (!$env:AEGIS_CONNECTION_TEST_EXE -or !$env:AEGIS_CONNECTION_SERVICE_PACKAGE) { throw 'required_native_gate_inputs_missing' }
          python manager/manage.py test devices.tests.test_connection_agent --settings=aegis_manager.test_settings --verbosity 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summary = [ordered]@{
            schema_version = '1.0'
            source_commit = $env:AEGIS_CONNECTION_SOURCE_COMMIT
            runtime = '${{ matrix.runtime }}'
            checks = @('production-django-issuer-views', 'published-cli-ip-san-mtls', 'same-uuid-reconnect', 'manager-revoke', 'native-service-account-start-stop', 'reinstall-identity-preserved', 'uninstall-identity-preserved')
            result = 'passed'
            reboot_before_login = 'owner-lab-gate-not-executed'
            run_url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          }
          $summary | ConvertTo-Json -Depth 4 | Out-File -LiteralPath (Join-Path $env:AEGIS_CONNECTION_RELEASE 'verification.json') -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AEGIS-Agent-Connection-${{ matrix.runtime }}-${{ github.run_id }}
          path: ${{ runner.temp }}/connection-release/*
          if-no-files-found: error
          retention-days: 14
