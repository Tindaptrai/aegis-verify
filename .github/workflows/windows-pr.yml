name: Windows PR checks

# The full fixture suite normally runs Linux only for PRs in ci.yml. Its separate
# installed-wheel jobs always test Linux and Windows. Changes to Windows-specific
# behaviour also run the complete Windows fixture suite here (#111, #114).
on:
  pull_request:
    paths:
      - 'backend/app/private_fs.py'
      - 'backend/app/cli/**'
      - 'backend/app/dashboard/**'
      - 'backend/app/demo/**'
      - 'backend/app/resources/**'
      - 'backend/app/intake/io.py'
      - 'connectors/wazuh/**'
      - 'demos/**'
      - 'scripts/**'
      - '**.ps1'
      - 'backend/tests/test_dashboard_launcher.py'
      - 'backend/tests/test_operations_*.py'
      - 'backend/tests/test_private_fs.py'
      - 'backend/tests/test_scn001_runner.py'
      - 'backend/tests/test_standalone_demo.py'
      - 'backend/tests/test_release_resources.py'
      - 'backend/tests/test_snapshot_bundle.py'
      - 'backend/tests/test_wazuh_*.py'
      - 'backend/tests/windows_acl.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'packaging/**'
      - '.gitattributes'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: windows-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-windows:
    name: Backend (windows-latest, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run complete fixture suite
        run: python -m pytest -q -rs -p no:cacheprovider
